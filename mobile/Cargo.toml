[package]
name = "magpie-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
omamail = { path = "..", default-features = false, features = ["mobile"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
futures-util = "0.3"
