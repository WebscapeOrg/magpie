name: Performance verification

on:
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "benchmarks/**"
      - "Cargo.*"
      - "backend-api.json"
      - "Makefile"
      - ".github/workflows/performance-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Synthetic verification (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [ci, benchmarks]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: performance-${{ matrix.profile }}-v2
          cache-targets: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: "6.8.3"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.0.0"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build dbus-daemon bubblewrap poppler-utils libdbus-1-3 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Run gates and retain all failures
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 scripts/verify-performance.py --profile "$PROFILE" --output "$RUNNER_TEMP/magpie-verification"
      - name: Summarize
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/magpie-verification/summary.md"; then
            cat "$RUNNER_TEMP/magpie-verification/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magpie-verification-${{ matrix.profile }}
          path: ${{ runner.temp }}/magpie-verification
          if-no-files-found: error
          retention-days: 14
