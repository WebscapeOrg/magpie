[workspace]
members = ["mobile"]
default-members = ["."]
resolver = "3"

[package]
name = "omamail"
version = "0.11.0"
edition = "2024"
publish = false

[features]
default = ["agent"]
agent = ["dep:psl"]
standalone = ["agent"]
integration-test-credentials = []
mobile = ["dep:psl"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tabled = { version = "0.20", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "io-std", "process", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

rusqlite = { version = "0.39", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
unicode-normalization = "0.1"
futures-util = "0.3"
libc = "0.2"
mailparse = "0.17"
encoding_rs = "0.8"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml_edit = "0.25"
json5 = "0.4"
rustls-native-certs = "0.8"
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Sender pictures group a company's subdomains under its registrable domain (Linux and the phone).
[target.'cfg(unix)'.dependencies]
psl = { version = "2.1", optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "hickory-dns"] }
hickory-resolver = "0.25"

[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
security-framework = "3"
