kind = "app"
name = "Magpie Mail"
summary = "Native mail for Gmail and Google Workspace, with multiple accounts, readable Points and keyboard navigation."
categories = ["Network", "Email", "Office"]
icon = "ui/assets/magpie-mail.png"
screenshots = [
  "docs/images/full-mail.webp",
  "docs/images/full-compose.webp",
  "docs/images/mini-list.webp",
]

# Invariant: the release ships the native app and its matching backend;
# OmaStore installs the standalone desktop app and launches its Qt host.
[linux.x86_64]
asset = "omamail-app-linux-x86_64.tar.gz"
exec = "omamail.app/bin/omamail-app"

# Invariant: ARM remains unavailable until a standalone asset exists; the plugin
# backend is not a compatible desktop application.
[linux.aarch64]
asset = "omamail-app-linux-aarch64.tar.gz"
exec = "omamail.app/bin/omamail-app"
